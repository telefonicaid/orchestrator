name: API Integration Tests
'on':
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

jobs:
  api-tests:
    name: API integration tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Python system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libldap2-dev libsasl2-dev libssl-dev

      - name: Install test dependencies
        run: python -m pip install -r requirements.txt

      - name: Start Orchestrator and dependencies
        run: docker compose -f docker-compose.yml -f docker-compose.ci.yml up -d --build --wait --wait-timeout 300

      - name: Wait for Orchestrator API
        run: |
          for endpoint in http://localhost:5001/v3 http://localhost:17070/; do
            for attempt in {1..60}; do
              status=$(curl --silent --output /dev/null --write-out '%{http_code}' "$endpoint" || true)
              if [[ "$status" =~ ^[1-4][0-9][0-9]$ ]]; then
                break
              fi
              sleep 5
            done
            [[ "$status" =~ ^[1-4][0-9][0-9]$ ]]
          done
          curl --fail --retry 60 --retry-delay 5 --retry-connrefused http://localhost:8084/v1.0/version

      - name: Run API tests
        env:
          PYTHONPATH: src
        run: python src/tests/api/test_api.py

      - name: Show container logs on failure
        if: failure()
        run: docker compose -f docker-compose.yml -f docker-compose.ci.yml logs --no-color

      - name: Stop test environment
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.ci.yml down --remove-orphans